services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dataagent
      POSTGRES_PASSWORD: dataagent
      POSTGRES_DB: dataagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATAAGENT_DATABASE_URL: postgresql+psycopg://dataagent:dataagent@postgres:5432/dataagent
      DATAAGENT_ENVIRONMENT: development
      DATAAGENT_AUTH_MODE: offline
      DATAAGENT_AZURE_TRANSPORT: fake
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      DATAAGENT_DATABASE_URL: postgresql+psycopg://dataagent:dataagent@postgres:5432/dataagent
      DATAAGENT_ENVIRONMENT: development
      DATAAGENT_AUTH_MODE: offline
      DATAAGENT_AZURE_TRANSPORT: fake
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["worker"]
    environment:
      DATAAGENT_DATABASE_URL: postgresql+psycopg://dataagent:dataagent@postgres:5432/dataagent
      DATAAGENT_ENVIRONMENT: development
      DATAAGENT_AUTH_MODE: offline
      DATAAGENT_AZURE_TRANSPORT: fake
      DATAAGENT_WORKER_ID: worker-local-1
    depends_on:
      migrate:
        condition: service_completed_successfully
