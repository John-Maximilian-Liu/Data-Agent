[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-sdk"
version = "0.1.0"
description = "Python SDK for Data Agent ingestion, charts, benchmarks, and experiments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["dataagent_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
