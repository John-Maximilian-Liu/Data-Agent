# Phase 1 — AKS API Deployment (Workload ID for Azure OpenAI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataagent-api
  labels:
    app.kubernetes.io/name: dataagent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dataagent
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataagent
        app.kubernetes.io/component: api
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dataagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: IMAGE_REF
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dataagent-config
            - secretRef:
                name: dataagent-secrets
                optional: true
          env:
            - name: DATAAGENT_ENVIRONMENT
              value: production
            - name: DATAAGENT_AUTH_MODE
              value: oidc
            - name: DATAAGENT_AZURE_USE_ENTRA
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: dataagent-api
spec:
  selector:
    app.kubernetes.io/name: dataagent
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
